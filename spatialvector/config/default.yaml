camera:
  device_index: 0
  resolution: [1280, 720]
  target_fps: 30
  queue_size: 5

detector:
  model_path: "yolov8n.pt"
  confidence_threshold: 0.4
  class_filter: ["person", "bicycle", "car", "chair"]

tracker:
  backend: "bytetrack"       # or "botsort"
  history_length: 10
  max_missed_frames: 15
